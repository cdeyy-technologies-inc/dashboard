name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# env:
#   NODE_ENV: development
#     NODE_ENV: development in that job means anything you run (including pnpm run dev) sees process.env.NODE_ENV === 'development', so Next.js will load config in this order: .env.development.local → .env.local → .env.development → .env. In CI you usually only have .env.development, so that file supplies the values.
#   POSTGRES_URL: postgres://nextjs:nextjs@localhost:5432/nextjs
#   POSTGRES_USER: nextjs
#   POSTGRES_HOST: localhost
#   POSTGRES_SSL: false


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm install -g pnpm && pnpm install
      - name: Run Unit / Jest tests
        # pnpm test uses jest.config.ts automatically, and use .env.test for environment variables
        run: pnpm test

  e2e:
    needs: build
    runs-on: ubuntu-latest
    env: 
      NODE_ENV: development
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install pnpm and project deps
        run: npm install -g pnpm && pnpm install
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Install Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose
      - name: Start local PostgreSQL db in docker
        run: docker-compose up -d && sleep 3 
      - name: examine docker log
        run: docker logs nextjs_test_db
      - name: Wait for PostgreSQL to be ready
        run: |
          echo "Waiting for PostgreSQL to be ready..."
          timeout=30
          until docker exec nextjs_test_db pg_isready -U nextjs -d nextjs || [ $timeout -eq 0 ]; do
            sleep 1
            ((timeout--))
            echo "Waiting... $timeout seconds remaining"
          done
          if [ $timeout -eq 0 ]; then
            echo "Timed out waiting for PostgreSQL"
            exit 1
          fi
      - name: Seed test data
        run: docker exec nextjs_test_db psql -U nextjs -d nextjs -f /docker-entrypoint-initdb.d/seed-test-data.sql
      - name: Start dev server and wait for http://localhost:3000
        run: pnpm run dev & npx wait-port localhost:3000 -t 20000
      - name: Run Playwright E2E tests
        # uses npx so no package.json changes are required
        run: npx playwright test --reporter=html
      - name: Test Teardown - stop local postgresl db in docker
        run: pnpm run test:localdb:down
      - name: Upload Playwright HTML report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
