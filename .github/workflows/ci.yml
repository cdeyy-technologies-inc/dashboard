name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm install -g pnpm && pnpm install
      - name: Run tests
        run: pnpm test

  e2e:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install pnpm and project deps
        run: npm install -g pnpm && pnpm install
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Test Setup - start local postgresl db in docker
        run: pnpm run test:localdb:up & npx wait-port localhost:5432 -t 5000
      - name: Start dev server and wait for http://localhost:3000
        run: pnpm run dev & npx wait-port localhost:3000 -t 10000
      - name: Run Playwright E2E tests
        # uses npx so no package.json changes are required
        run: npx playwright test --reporter=html
      - name: Test Teardown - stop local postgresl db in docker
        run: pnpm run test:localdb:down
      - name: Upload Playwright HTML report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
